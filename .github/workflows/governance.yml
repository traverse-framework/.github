# Org-wide governance baseline gate (this repo calls its own reusable workflow).
name: governance

on:
  pull_request: {}

permissions:
  contents: read
  # reusable-review-record.yml reads PR comments, labels and files; a called
  # workflow cannot request more than its caller grants.
  pull-requests: read

jobs:
  baseline:
    uses: traverse-framework/.github/.github/workflows/reusable-governance.yml@bootstrap-governance

  review-record:
    # Warning-mode Decision 133 check (.github#56). Missing records do not fail.
    uses: ./.github/workflows/reusable-review-record.yml

  review-record-tests:
    name: review-record-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run review-record fixture tests
        run: bash scripts/ci/review_record_check_test.sh

  dev-health-tests:
    name: dev-health-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run dev-health report fixture tests
        run: python3 scripts/org/dev_health_report_test.py

  claim-tests:
    name: claim-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run claim/release script tests
        run: bash scripts/agent/claim_test.sh

  skills-sync-tests:
    name: skills-sync-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run skill sync and drift-check tests
        run: bash scripts/agent/sync_skills_test.sh

  audit-tests:
    name: audit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run org audit tests
        run: bash scripts/org/audit_compliance_test.sh
